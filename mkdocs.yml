# Site Details
site_name: WorldBuilder Docs
site_description: The official guide for WorldBuilder, the ultimate tool for creating immersive worlds and stories. Explore our comprehensive documentation to unlock the full potential of your creative endeavors.
site_author: Berserkir-Wolf
edit_uri: https://github.com/Berserkir-Wolf/WorldBuilder/edit/development/docs/
repo_url: https://github.com/Berserkir-Wolf/WorldBuilder
repo_name: Berserkir-Wolf/WorldBuilder
copyright: >
  Copyright &copy; 2026 <a href="https://github.com/Berserkir-Wolf/">Berserkir-Wolf</a> – <a href="#__consent">Change cookie settings</a>
# Site appearance (logos, colours, icons)
theme:
  name: material
  language: en
  code_wrap: true
  features:
    - content.code.copy
    - content.tabs.link
    - header.autohide
    - navigation.expand
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
  #favicon: assets/logo/favicon.ico
  #logo: assets/logo/ombi-logo.png
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

# Additional links
extra:
  #analytics:
  #  provider: google
  #  property: _pending_
  consent:
    title: Cookie consent
    actions:
      - accept
      - manage
      - reject
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well as to store your site preferences.
      With your consent, you're helping us to make our documentation better (and to work better for you).

# Extra CSS
extra_css:
  - assets/stylesheets/extra.css

# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - meta
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      guess_lang: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.saneheaders
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - sane_lists
  - toc:
      permalink: true
      toc_depth: 5

# mkdocs function extensions
plugins:
  - search
  - git-revision-date-localized:
      type: timeago
      locale: en
      fallback_to_build_date: false
  - redirects: # Pretty URLs (links with nav)
      redirect_maps:
        # Guides redirects
        'installation.md': 'guides/installation.md'

# Navigation Layout
nav:
  - Home: index.md
  - Getting Started:
    - Installation: guides/installation.md
